.react-flow{background:#0a1020;border-radius:8px;padding:16px;margin-top:12px}

<body>
<div class="shell">

  <div class="logo">
    <h1>איך בונים</h1>
    <p>מדריך בנייה לאפליקציית ARCHI·TACT</p>
  </div>
  <div class="phase-label">⬤ הגדרה</div>
  <button class="step-btn active" onclick="go(0)" id="btn0"><span class="num">0</span><span class="step-label">אפיון ראשוני</span></button>
  <button class="step-btn" onclick="go(1)" id="btn1"><span class="num">1</span><span class="step-label">סכמת מסד נתונים</span></button>
  <button class="step-btn" onclick="go(2)" id="btn2"><span class="num">2</span><span class="step-label">הגדרת סביבה</span></button>
  <div class="phase-label">⬤ בנייה</div>
  <button class="step-btn" onclick="go(3)" id="btn3"><span class="num">3</span><span class="step-label">פרויקטים</span></button>
  <button class="step-btn" onclick="go(4)" id="btn4"><span class="num">4</span><span class="step-label">לקוחות</span></button>
  <button class="step-btn" onclick="go(5)" id="btn5"><span class="num">5</span><span class="step-label">לוח משימות</span></button>

  <button class="step-btn" onclick="go(8)" id="btn8"><span class="num">8</span><span class="step-label">חיבור ופריסה</span></button>
</div>
<div class="main">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="topbar">
    <span class="topbar-title" id="ttitle">שלב 0 — אפיון ראשוני</span>
    <div class="topbar-nav">
      <button class="nav-btn" onclick="prev()">→ הקודם</button>
      <button class="nav-btn primary" onclick="next()">← הבא</button>

          </div>

        </div>
        <div class="bc-nav"><div class="bc-tab active">ARCHI·TACT</div></div>
      </div>
      <div class="app-frame"><div id="app-screen"></div></div>
    </div>
  </div>
</div>
</div>
<script>
let CUR=0;
const APP={
  tasks:[
    {id:1,title:'תכנון קומה 3',proj:'וילה כרמל',stage:'todo'},
    {id:2,title:'תיאום חשמל',proj:'מגדל מסחרי',stage:'todo'},
    {id:3,title:'חזיתות וגגות',proj:'שכונת גן',stage:'doing'},
    {id:4,title:'אפיון ראשוני',proj:'וילה כרמל',stage:'doing'},
    {id:5,title:'חוזה עם לקוח',proj:'Reit Capital',stage:'done'},
    {id:6,title:'הגשת בקשת היתר',proj:'שכונת גן',stage:'done'},
  ],
  projects:[
    {id:1,name:'וילה כרמל',client:'משפחת לוי',budget:'₪2.4M',status:'active'},
    {id:2,name:'מגדל מסחרי',client:'Reit Capital',budget:'₪18M',status:'planning'},
    {id:3,name:'שכונת גן',client:'עיריית רמת גן',budget:'₪45M',status:'done'},
  ],
  clients:[
    {id:1,name:'משפחת לוי',phone:'050-111-2222',email:'levi@gmail.com',count:1},
    {id:2,name:'Reit Capital',phone:'03-7654321',email:'info@reit.co.il',count:2},
    {id:3,name:'עיריית רמת גן',phone:'03-6752211',email:'arch@rg.gov.il',count:1},
    {id:4,name:'משפחת כהן',phone:'052-333-4444',email:'cohen@walla.co.il',count:0},
  ],
  pSearch:'',cSearch:'',uploadState:'idle'
};
function sLabel(s){return{active:'פעיל',planning:'תכנון',done:'הושלם'}[s]||s;}
function go(n){
  CUR=Math.max(0,Math.min(8,n));
  document.querySelectorAll('.step-btn').forEach((b,i)=>b.classList.toggle('active',i===CUR));
  document.getElementById('prog').style.width=((CUR/8)*100)+'%';
  const titles=['שלב 0 — אפיון ראשוני','שלב 1 — סכמת מסד נתונים','שלב 2 — הגדרת סביבה','שלב 3 — פרויקטים','שלב 4 — לקוחות','שלב 5 — לוח משימות','שלב 6 — ייבוא מסמכים','שלב 7 — דשבורד','שלב 8 — חיבור ופריסה'];
  document.getElementById('ttitle').textContent=titles[CUR];
  renderExplain();renderDemo();
}
function next(){go(CUR+1);}
function prev(){go(CUR-1);}
const STEPS=[
  {title:'אפיון ראשוני',subtitle:'מה בונים ולמה',
   prompt:`בנה אפליקציית ניהול משרד אדריכלים בשם ARCHI·TACT.\n\nהמשתמשים: אדריכלים ומנהלי פרויקטים.\nשפה: עברית, RTL, מצב כהה.\n\nמה האפליקציה מנהלת:\n• פרויקטים — שם, לקוח, תקציב, סטטוס, תאריך יעד\n• לקוחות — שם, טלפון, מייל\n• משימות — כותרת, פרויקט, שלב\n\nהעמודים שצריך לבנות:\n• דשבורד עם סטטיסטיקות ומספרים\n• רשימת פרויקטים עם חיפוש וכרטיסיות\n• רשימת לקוחות עם חיפוש\n• לוח משימות חזותי — Kanban\n• ייבוא מסמכים עם AI\n\nטכנולוגיות: React עם TypeScript, Tailwind CSS, Supabase, Vercel.`,
   tip:'<strong>עצה:</strong> הפרומפט הזה הוא כמו תוכנית עבודה. ככל שתגדיר יותר בהתחלה — כך Claude Code יבנה בדיוק מה שרצית, בלי לנחש.'},
  {title:'סכמת מסד נתונים',subtitle:'4 טבלאות ב-Supabase',
   prompt:`עכשיו צור את מסד הנתונים ב-Supabase.\n\nשאל אותי: מה שם הפרויקט ב-Supabase שלך?\nכשאני אתן לך את השם — תיצור את כל הטבלאות אוטומטית.\n\nהטבלאות הנדרשות:\n• clients — מזהה, שם, טלפון, מייל\n• projects — מזהה, שם, לקוח (מקושר ל-clients), תקציב, סטטוס, תאריך יעד\n• tasks — מזהה, כותרת, פרויקט (מקושר ל-projects), שלב\n• documents — מזהה, קישור לקובץ, פרויקט (מקושר ל-projects), נתונים שחולצו, סטטוס\n\nכל טבלה מחוברת לאחרות דרך Foreign Keys.\nהפעל הגנת Row Level Security על כל הטבלאות.`,
   tip:'<strong>Supabase Connector:</strong> כשיש לך Supabase מחובר ל-Claude Code — הוא יוצר את הטבלאות אוטומטית. לא צריך לכתוב SQL בעצמך.'},
  {title:'הגדרת סביבה',subtitle:'GitHub + Vercel + משתני סביבה',
   prompt:`הגדר את סביבת הפיתוח לאפליקציה.\n\nצעד ראשון — GitHub:\n• צור ריפוזיטורי חדש בשם archi-tact\n• קבע את מבנה התיקיות: src/components, src/pages, src/lib\n\nצעד שני — Vercel:\n• חבר את הריפוזיטורי ל-Vercel\n• כל push ל-main יפרוס אוטומטית\n\nצעד שלישי — משתני סביבה:\n• שאל אותי על מפתחות ה-API הנדרשים\n• הוסף את המפתחות ל-Vercel ו-Claude Code\n\nאחרי ההגדרה: שלח לי את כתובת ה-URL של הפרויקט.`,
   tip:'<strong>עצה:</strong> לא צריך לעשות את זה ידנית — Claude Code + Vercel Connector יטפלו בהגדרה. תן רק אישורים כשנדרש.'},
